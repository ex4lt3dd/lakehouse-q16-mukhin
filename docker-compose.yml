name: mukhin-q16
services:
  minio:
    image: pgsty/silo:latest@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Run scripts/start.ps1}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run scripts/start.ps1}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio-data:/data"]
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Run scripts/start.ps1}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    image: quay.io/lakekeeper/catalog:latest-main@sha256:1e8a557f2bd9a9a99cb6a4149fae23e823f1e70db6407aeb15b4d1c379b1c0b2
    command: migrate
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${PG_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:${PG_PASSWORD}@postgres:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:${PG_PASSWORD}@postgres:5432/postgres
    depends_on:
      postgres: {condition: service_healthy}
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main@sha256:1e8a557f2bd9a9a99cb6a4149fae23e823f1e70db6407aeb15b4d1c379b1c0b2
    command: serve
    environment: *lakekeeper-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8181:8181"]
  buckets:
    image: pgsty/mc:latest@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    entrypoint: /bin/sh
    command:
      - -c
      - 'until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing local/bronze local/silver local/gold'
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on: [minio]
  trino:
    image: trinodb/trino:476@sha256:00125e40d063bc4816d165482f6044872b18b56026fb959d3b28ce1f96ffbbee
    ports: ["127.0.0.1:8080:8080"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./catalog:/etc/trino/catalog:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
    depends_on: [lakekeeper, minio]
  superset:
    build: ./superset
    ports: ["127.0.0.1:8088:8088"]
    environment:
      SUPERSET_CONFIG_PATH: /app/config/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
      - ./superset/superset_config.py:/app/config/superset_config.py:ro
      - ./superset/init.sh:/app/config/init.sh:ro
      - superset-data:/app/superset_home
    command: ["/bin/sh", "/app/config/init.sh"]
    depends_on: [trino]
volumes:
  minio-data:
  pg-data:
  superset-data:
